<!DOCTYPE html>
<html lang="de">
  <head></head>
  <body style="margin: 0; padding: 0">
    <script>
      function savePicture() {
        let date = new Date().toISOString().split("T")[0];
        console.log(date);
        fetch(`/picture?date=${date}`);
      }
    </script>
    <div
      style="
        width: 100vw;
        height: 80vh;
        display: flex;
        flex-flow: column nowrap;
        justify-content: flex-start;
        align-items: center;
        gap: 2rem;
      "
    >
      <div
        style="margin-top: 8rem; height: 480px; box-shadow: 4px 4px 8px #666"
      >
        <img
          src="/stream"
          alt="MJpeg-Stream"
          style="width: 100%; height: 100%"
        />
      </div>
      <button
        onclick="savePicture()"
        style="
          margin-top: auto;
          border: none;
          border-radius: 4px;
          padding-block: 1.5rem;
          padding-inline: 2.5rem;
          font-size: x-large;
          box-shadow: 4px 4px 8px #666;
          background-color: #166984;
          color: #ededed;
          cursor: pointer;
        "
      >
        Einzelbild aufnehmen
      </button>
    </div>
  </body>
</html>

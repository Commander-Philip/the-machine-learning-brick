<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        --drop-shadow: 4px 4px 8px #666;
      }

      button:hover {
        filter: brightness(1.2);
      }
      button:active {
        filter: brightness(0.8);
      }
    </style>
    <title>Fotoapparat - OpenMV</title>
    <script>
      function addNotification(message, backgroundColor, hideAfterMs = 2500) {
        const container = document.getElementById("notification-container");
        const template = document.getElementById("notification-template");
        const notification = template.content
          .cloneNode(true)
          .querySelector("div");

        notification.style.backgroundColor = backgroundColor;
        notification.querySelector("span").innerHTML = message;

        container.appendChild(notification);

        setTimeout(
          () => removeChild("notification-container", notification),
          hideAfterMs
        );
      }

      function removeChild(idOfParent, childToRemove) {
        const container = document.getElementById(idOfParent);
        const firstChild = container.firstChild;
        container.removeChild(firstChild);
      }

      function showSuccessNotification(message) {
        addNotification(`&#10004; ${message}`, "#49c356", 2500);
      }

      function showFailureNotification(message) {
        addNotification(`&#10008; ${message}`, "#d75050", 2500);
      }

      async function savePicture(event) {
        const form = event.target;
        console.log(form);
        console.log("isValid: ", form.checkValidity());
        if (!form.checkValidity()) {
          form.reportValidity();
        }

        event.preventDefault();
        let dateOfPicture = new Date().toISOString().split("T")[0];
        const filenamePrefix = form.elements["filename-prefix"].value;

        try {
          const response = await fetch(
            `/picture?date-of-picture=${dateOfPicture}&filename-prefix=${filenamePrefix}`,
            {
              method: "post",
              signal: AbortSignal.timeout(2000),
            }
          );
          showSuccessNotification(
            `Foto ${await response.text()} erfolgreich gespeichert`
          );
        } catch (e) {
          showFailureNotification("Foto speichern fehlgeschlagen!");
          console.warn("Fehler beim Fotografieren: ", e);
        }
      }
    </script>
  </head>
  <body style="margin: 0; padding: 0">
    <div
      style="
        width: 100vw;
        height: 80vh;
        display: flex;
        flex-flow: column nowrap;
        justify-content: flex-start;
        align-items: center;
        gap: 2rem;
      "
    >
      <div
        style="
          margin-top: 8rem;
          min-height: 480px;
          min-width: 640px;
          box-shadow: var(--drop-shadow);
        "
      >
        <img
          src="/stream"
          alt="MJpeg-Stream"
          style="width: 100%; height: 100%"
        />
      </div>
      <form
        onsubmit="savePicture(event)"
        style="display: flex; flex-flow: column nowrap; gap: 1rem"
      >
        <div>
          <label for="filename-prefix" style="display: block"
            >Präfix für den Dateinamen</label
          >
          <input
            style="
              height: 12;
              font-size: x-large;
              box-shadow: var(--drop-shadow);
              padding-block: 0.5rem;
              padding-inline: 1rem;
            "
            name="filename-prefix"
            type="text"
            placeholder="Dateiname"
            pattern="[a-zA-Z0-9\-_]*"
          />
        </div>
        <button
          type="submit"
          style="
            margin-top: auto;
            border: none;
            border-radius: 4px;
            padding-block: 1.5rem;
            padding-inline: 2.5rem;
            font-size: x-large;
            box-shadow: var(--drop-shadow);
            background-color: #166984;
            color: #ededed;
            cursor: pointer;
          "
        >
          Einzelbild aufnehmen
        </button>
      </form>
    </div>
    <div
      id="notification-container"
      style="
        display: flex;
        flex-flow: column nowrap;
        justify-content: flex-start;
        align-items: flex-end;
        gap: 1.4rem;
        position: absolute;
        top: 0;
        right: 0;
        height: 100vh;
        padding-top: 2rem;
        padding-right: 4rem;
      "
    ></div>
    <template id="notification-template">
      <div
        style="
          padding-inline: 1rem;
          padding-block: 0.7rem;
          border-radius: 4px;
          box-shadow: var(--drop-shadow);
          width: 25rem;
          font-size: 20px;
          font-weight: 500;
        "
      >
        <span></span>
      </div>
    </template>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
  <head>
    <title>Fotoapparat - OpenMV</title>
    <script>
      function showMessage(id, timeout = 2000) {
        const div = document.getElementById(id);
        div.style.visibility = "visible";
        setTimeout(hideMessage, timeout);
      }

      function hideMessage() {
        const div = document.getElementById("foto-save-succeeded");
        div.style.visibility = "hidden";
      }

      async function savePicture() {
        let date = new Date().toISOString().split("T")[0];
        console.log(date);

        try {
          await fetch(`/picture?date=${date}`, {
            signal: AbortSignal.timeout(2000),
          });
          showMessage("foto-save-succeeded");
        } catch (e) {
          showMessage("foto-save-failed");
          console.log("Fehler beim Fotografieren: ", e);
        }
      }
    </script>
  </head>
  <body style="margin: 0; padding: 0">
    <div
      style="
        width: 100vw;
        height: 80vh;
        display: flex;
        flex-flow: column nowrap;
        justify-content: flex-start;
        align-items: center;
        gap: 2rem;
      "
    >
      <div
        style="margin-top: 8rem; height: 480px; box-shadow: 4px 4px 8px #666"
      >
        <img
          src="/stream"
          alt="MJpeg-Stream"
          style="width: 100%; height: 100%"
        />
      </div>
      <button
        onclick="savePicture()"
        style="
          margin-top: auto;
          border: none;
          border-radius: 4px;
          padding-block: 1.5rem;
          padding-inline: 2.5rem;
          font-size: x-large;
          box-shadow: 4px 4px 8px #666;
          background-color: #166984;
          color: #ededed;
          cursor: pointer;
        "
      >
        Einzelbild aufnehmen
      </button>
    </div>
    <div
      id="foto-save-succeeded"
      style="
        position: absolute;
        bottom: 5rem;
        left: auto;
        right: auto;
        visibility: hidden;
        background-color: #168421;
        padding-inline: 1rem;
        padding-block: 0.7rem;
        border-radius: 4px;
        box-shadow: 4px 4px 8px #666;
      "
    >
      <span> Foto erfolgreich gespeichert! </span>
    </div>
    <div
      id="foto-save-failed"
      style="
        position: absolute;
        bottom: 5rem;
        left: auto;
        right: auto;
        visibility: hidden;
        background-color: #841616;
        padding-inline: 1rem;
        padding-block: 0.7rem;
        border-radius: 4px;
        box-shadow: 4px 4px 8px #666;
      "
    >
      <span> Foto speichern fehlgeschlagen! </span>
    </div>
    <div class="notification-container"></div>
  </body>
</html>
